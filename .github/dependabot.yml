# Dependabot configuration.
#
# Security updates are enabled in the repository settings. This file turns on
# weekly version updates for npm and GitHub Actions, and sets commit-message
# prefixes so PR titles follow Conventional Commits ("fix(deps): ..." /
# "chore(deps): ...") and pass the pull-request-lint workflow
# (amannn/action-semantic-pull-request, allowed types: feat, fix, chore).
#
# open-pull-requests-limit: 5 caps open version-update PRs per ecosystem;
# security update PRs are not affected by this limit.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/infrastructure"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
